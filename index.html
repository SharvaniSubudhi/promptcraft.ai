  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- GEMINI API INTEGRATION HELPERS ---
    const MODEL_NAME = "gemini-3-flash-preview";

    async function callGeminiAPI(systemPrompt, userQuery, userApiKey, isJson = false) {
      let url;
      let payload;

      if (userApiKey && userApiKey.trim() !== "") {
        url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${userApiKey.trim()}`;
        payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };
        if (isJson) {
          payload.generationConfig = { responseMimeType: "application/json" };
        }
      } else {
        url = `/api/gemini`;
        payload = { systemPrompt, userQuery, isJson };
      }

      let attempts = 0;
      const maxAttempts = 3;
      let delay = 1000;

      while (attempts < maxAttempts) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            if (res.status === 400 || res.status === 403) {
              throw new Error("Invalid or missing Gemini API Key. Please click 'Configure Gemini API Key' in the top bar to enter a valid key.");
            }
            throw new Error(`Gemini API Error: Status ${res.status}`);
          }

          const data = await res.json();
          const text = userApiKey ? data?.candidates?.[0]?.content?.parts?.[0]?.text : data?.text;
          if (!text) throw new Error("Received empty response from Gemini API engine.");

          return isJson ? (typeof text === 'string' ? JSON.parse(text) : text) : text;
        } catch (err) {
          attempts++;
          if (attempts >= maxAttempts) throw err;
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }
    }

    // --- TEMPLATES DATASET ---

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('promptcraft_gemini_key') || '');
      const [showKeyModal, setShowKeyModal] = useState(false);
      const [tempKeyInput, setTempKeyInput] = useState('');
      
      // Prompt Improver State
      const [originalPrompt, setOriginalPrompt] = useState('');
      const [useCase, setUseCase] = useState('General');
      const [outputStyle, setOutputStyle] = useState('Detailed');
      const [additionalContext, setAdditionalContext] = useState('');
      const [improverLoading, setImproverLoading] = useState(false);
      const [improverResult, setImproverResult] = useState(null);
      const [improverError, setImproverError] = useState(null);
      const [isSampleMode, setIsSampleMode] = useState(false);

      // Evaluator State
      const [evalPrompt, setEvalPrompt] = useState('');
      const [evalLoading, setEvalLoading] = useState(false);
      const [evalResult, setEvalResult] = useState(null);
      const [evalError, setEvalError] = useState(null);

      // Compare State
      const [compOrigPrompt, setCompOrigPrompt] = useState('');
      const [compImprPrompt, setCompImprPrompt] = useState('');
      const [compLoading, setCompLoading] = useState(false);
      const [compResults, setCompResults] = useState(null);
      const [compError, setCompError] = useState(null);

      // Saved Prompts State
      const [savedPrompts, setSavedPrompts] = useState(() => {
        try {
          const local = localStorage.getItem('promptcraft_saved');
          return local ? JSON.parse(local) : [
            {
              id: 'sp1',
              title: 'Beginner ML Explainer',
              category: 'Study',
              original: 'Explain machine learning to a beginner.',
              improved: 'Act as an engaging Computer Science Professor. Explain the foundational concept of Machine Learning to a complete beginner with no prior programming experience.\n\nStructure your explanation as follows:\n1. Hook: Everyday analogy (e.g., email spam filter).\n2. Core Paradigms: Compare Supervised, Unsupervised, and Reinforcement learning simply.\n3. Contrast: Contrast traditional rule-based software with machine learning models.\n4. Key Vocabulary: Define Model, Training Data, Features, and Inference in plain language.\n5. Quiz: End with 5 short multiple-choice questions with answer key.',
              date: new Date().toLocaleDateString()
            }
          ];
        } catch(e) {
          return [];
        }
      });

      // Toast Notification State
      const [toast, setToast] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('promptcraft_saved', JSON.stringify(savedPrompts));
        } catch(e) {}
      }, [savedPrompts]);

      const saveApiKey = (key) => {
        const trimmed = key.trim();
        setApiKey(trimmed);
        localStorage.setItem('promptcraft_gemini_key', trimmed);
        setShowKeyModal(false);
        showToast(trimmed ? "Gemini API Key saved securely!" : "API Key cleared from browser storage.");
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const copyToClipboard = (text, label = "Prompt copied to clipboard!") => {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(label)).catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      };

      const fallbackCopy = (text, label) => {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand("copy");
          showToast(label);
        } catch (err) {
          showToast("Failed to copy text", "error");
        }
        document.body.removeChild(textarea);
      };

      // --- IMPROVER ACTION ---
      const handleImprovePrompt = async (e) => {
        if (e) e.preventDefault();
        if (!originalPrompt.trim()) {
          showToast("Please enter an original prompt first.", "warning");
          return;
        }

        setIsSampleMode(false);
        setImproverLoading(true);
        setImproverError(null);
        setImproverResult(null);

        const sysPrompt = `You are PromptCraft AI, an elite Prompt Engineering Laboratory system. Your job is to transform raw, basic prompts into highly structured, context-rich, effective prompts for Large Language Models.
You will return JSON with this exact structure:
{
  "improvedPrompt": "The enhanced, ready-to-use prompt here",
  "explanation": "Clear explanation of structural changes made and why",
  "keyImprovements": ["Improvement point 1", "Improvement point 2", "Improvement point 3"],
  "followUpSuggestions": ["Suggested tweak 1", "Suggested tweak 2"]
}`;

        const userMsg = `Transform this prompt:
Original Prompt: "${originalPrompt}"
Domain/Use Case: ${useCase}
Target Tone/Style: ${outputStyle}
Additional Context/Constraints: ${additionalContext || "None specified"}`;

        try {
          const res = await callGeminiAPI(sysPrompt, userMsg, apiKey, true);
          setImproverResult(res);
        } catch (err) {
          console.error(err);
          setImproverError(err.message || "Failed to generate improved prompt using Gemini API.");
        } finally {
          setImproverLoading(false);
        }
      };

      // --- SAMPLE LOADER ACTION ---
      const handleLoadSample = () => {
        const sampleOrig = "Explain machine learning to a beginner.";
        setOriginalPrompt(sampleOrig);
        setUseCase("Study");
        setOutputStyle("Detailed");
        setAdditionalContext("Targeting high school or first-year college students.");
        setIsSampleMode(true);
        setImproverError(null);

        setImproverResult({
          improvedPrompt: `Act as an engaging Computer Science Professor. Explain the foundational concepts of Machine Learning to a high school or first-year college student with zero prior background.

Your explanation must include the following structured elements:
1. Analogy: Start with a relatable everyday analogy (e.g., an automated email spam filter or video recommendation algorithm).
2. ML Paradigms: Clearly break down the differences between:
   - Supervised Learning
   - Unsupervised Learning
   - Reinforcement Learning
3. Paradigm Shift: Contrast traditional rule-based software development with machine learning.
4. Key Terminology: Define terms simply in plain language (Model, Training Data, Features, Prediction/Inference).
5. Visual Diagram: Include a basic ASCII/text workflow diagram showing (Data -> Training -> Model -> Prediction).
6. Knowledge Check: Conclude with 5 short multiple-choice questions complete with an answer key at the bottom.`,
          explanation: "The prompt was expanded from a single sentence into a multi-part role-based instruction. It explicitly sets an persona (CS Professor), defines target audience constraints, mandates specific structural components (analogy, paradigms, definitions, diagram), and adds a self-assessment feature.",
          keyImprovements: [
            "Assigned explicit persona ('Computer Science Professor')",
            "Specified audience level (beginner / high school / college)",
            "Required practical analogy and text-based workflow diagram",
            "Added concrete task constraints and output formatting requirements"
          ],
          followUpSuggestions: [
            "Ask the AI to generate python code examples using Scikit-Learn",
            "Request a glossary table of ML terminology"
          ]
        });

        showToast("Loaded sample demonstration data!");
      };

      // --- EVALUATOR ACTION ---
      const handleEvaluatePrompt = async () => {
        if (!evalPrompt.trim()) {
          showToast("Please enter a prompt to evaluate.", "warning");
          return;
        }

        setEvalLoading(true);
        setEvalError(null);
        setEvalResult(null);

        const sysPrompt = `You are a heuristic Prompt Evaluator. Analyze the given prompt across 6 critical quality dimensions.
Calculate realistic scores (0-100) and provide evidence-based explanations.
IMPORTANT: The overall score must be the exact average of the 6 dimensions.
Return ONLY valid JSON with this structure:
{
  "clarity": { "score": 85, "reason": "Reason for score..." },
  "specificity": { "score": 70, "reason": "Reason for score..." },
  "context": { "score": 60, "reason": "Reason for score..." },
  "taskDefinition": { "score": 90, "reason": "Reason for score..." },
  "outputFormat": { "score": 50, "reason": "Reason for score..." },
  "constraints": { "score": 40, "reason": "Reason for score..." },
  "overallScore": 66,
  "overallSummary": "Summary statement...",
  "topSuggestions": ["Suggestion 1", "Suggestion 2", "Suggestion 3"]
}`;

        try {
          const res = await callGeminiAPI(sysPrompt, `Evaluate this prompt:\n"${evalPrompt}"`, apiKey, true);
          setEvalResult(res);
        } catch (err) {
          console.error(err);
          setEvalError(err.message || "Could not calculate evaluation scores via Gemini API.");
        } finally {
          setEvalLoading(false);
        }
      };

      // --- COMPARE ACTION ---
      const handleRunComparison = async () => {
        if (!compOrigPrompt.trim() || !compImprPrompt.trim()) {
          showToast("Please provide both the original and improved prompts.", "warning");
          return;
        }

        setCompLoading(true);
        setCompError(null);
        setCompResults(null);

        try {
          const sys = "You are a neutral AI assistant responding directly to user instructions.";
          const [resOrig, resImpr] = await Promise.all([
            callGeminiAPI(sys, compOrigPrompt, apiKey, false),
            callGeminiAPI(sys, compImprPrompt, apiKey, false)
          ]);

          setCompResults({
            origResponse: resOrig,
            imprResponse: resImpr
          });
        } catch (err) {
          console.error(err);
          setCompError(err.message || "Error running prompt comparison.");
        } finally {
          setCompLoading(false);
        }
      };

      // --- SAVE PROMPT ACTION ---
      const handleSavePrompt = (title, category, original, improved) => {
        const newItem = {
          id: 'sp_' + Date.now(),
          title: title || 'Untitled Prompt',
          category: category || 'General',
          original,
          improved,
          date: new Date().toLocaleDateString()
        };
        setSavedPrompts([newItem, ...savedPrompts]);
        showToast("Prompt saved to local laboratory storage!");
      };

      // Send to Improver
      const sendToImprover = (promptText) => {
        setOriginalPrompt(promptText);
        setActiveTab('improver');
        showToast("Transferred to Prompt Improver!");
      };

      // Send to Evaluator
      const sendToEvaluator = (promptText) => {
        setEvalPrompt(promptText);
        setActiveTab('evaluator');
        showToast("Transferred to Prompt Evaluator!");
      };

      // Send to Comparison
      const sendToCompare = (orig, impr) => {
        setCompOrigPrompt(orig);
        setCompImprPrompt(impr);
        setActiveTab('compare');
        showToast("Transferred to Prompt Comparison Workspace!");
      };

      return (

                    </div>
                    <p className="text-xs font-semibold text-slate-700">No Prompt Generated Yet</p>
                    <p className="text-[11px] text-slate-400 max-w-xs mt-1">
                      Enter a raw prompt on the left and click "Improve Prompt" to generate an optimized version.
                    </p>
                  </div>
                )}
              </div>

              {/* Action Buttons for Result */}
              {improverResult && (
                <div className="pt-4 mt-4 border-t border-slate-100 flex flex-wrap gap-2 justify-end">
                  <button
                    onClick={() => handleSavePrompt("Improved Prompt", useCase, originalPrompt, editedPrompt)}
                    className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-bookmark text-indigo-600"></i>
                    <span>Save to Lab</span>
                  </button>
                  <button
                    onClick={() => sendToEvaluator(editedPrompt)}
                    className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-gauge-high text-blue-600"></i>
                    <span>Evaluate Quality</span>
                  </button>
                  <button
                    onClick={() => sendToCompare(originalPrompt, editedPrompt)}
                    className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-xl transition flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-code-compare text-indigo-600"></i>
                    <span>Compare Outputs</span>
                  </button>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    // --- PROMPT EVALUATOR VIEW ---
    function EvaluatorView({
      evalPrompt, setEvalPrompt, evalLoading, evalResult, evalError,
      handleEvaluatePrompt, sendToImprover, copyToClipboard
    }) {
      const dimensions = [
        { key: 'clarity', label: 'Clarity & Precision' },
        { key: 'specificity', label: 'Specificity' },
        { key: 'context', label: 'Contextual Depth' },
        { key: 'taskDefinition', label: 'Task Definition' },
        { key: 'outputFormat', label: 'Output Structure' },
        { key: 'constraints', label: 'Constraints & Rules' }
      ];

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <h2 className="text-xl font-extrabold text-slate-900 flex items-center space-x-2">
              <i className="fa-solid fa-gauge-high text-indigo-600"></i>
              <span>Prompt Quality Evaluator</span>
            </h2>
            <p className="text-slate-500 text-xs mt-1">
              Benchmark prompt effectiveness across 6 essential heuristic prompt engineering criteria.
            </p>

            <div className="mt-4">
              <textarea
                rows="4"
                value={evalPrompt}
                onChange={(e) => setEvalPrompt(e.target.value)}
                placeholder="Paste any prompt here to analyze its quality..."
                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition custom-scrollbar"
              />
              <div className="mt-3 flex justify-between items-center">
                <span className="text-[11px] text-slate-400">
                  Scores are heuristic lab assessments based on key principles.
                </span>
                <button
                  onClick={handleEvaluatePrompt}
                  disabled={evalLoading}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow transition flex items-center space-x-2 disabled:opacity-50"
                >
                  {evalLoading ? (
                    <>
                      <i className="fa-solid fa-circle-notch fa-spin"></i>
                      <span>Evaluating...</span>
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-chart-bar"></i>
                      <span>Run Evaluation</span>
                    </>
                  )}
                </button>
              </div>
            </div>
          </div>

          {evalError && (
            <div className="p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs">
              {evalError}
            </div>
          )}

          {evalResult && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              {/* Overall Score Badge Card */}
              <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col items-center justify-center text-center">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                  Overall Prompt Score
                </span>
                
                <div className="relative w-32 h-32 flex items-center justify-center my-2">
                  <div className="w-28 h-28 rounded-full border-8 border-indigo-100 flex items-center justify-center bg-slate-50">
                    <span className="text-3xl font-extrabold text-indigo-600">
                      {evalResult.overallScore}
                    </span>
                    <span className="text-xs text-slate-400 font-bold">/100</span>
                  </div>
                </div>

                <p className="text-xs text-slate-600 leading-relaxed max-w-xs mt-2">
                  {evalResult.overallSummary}
                </p>

                <button
                  onClick={() => sendToImprover(evalPrompt)}
                  className="mt-4 w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center space-x-1.5"
                >
                  <i className="fa-solid fa-wand-magic-sparkles"></i>
                  <span>Improve This Prompt</span>
                </button>
              </div>

              {/* Dimension Score Progress Bars */}
              <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <h3 className="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">
                  Detailed Diagnostic Breakdown
                </h3>

                <div className="space-y-3.5">
                  {dimensions.map(({ key, label }) => {
                    const item = evalResult[key] || { score: 0, reason: '' };
                    return (
                      <div key={key} className="space-y-1">
                        <div className="flex justify-between text-xs">
                          <span className="font-semibold text-slate-700">{label}</span>
                          <span className="font-bold text-indigo-600">{item.score}/100</span>
                        </div>
                        <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                          <div 
                            className="h-full bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full transition-all duration-500"
                            style={{ width: `${item.score}%` }}
                          ></div>
                        </div>
                        <p className="text-[11px] text-slate-500 leading-normal">{item.reason}</p>
                      </div>
                    );
                  })}
                </div>

                {evalResult.topSuggestions?.length > 0 && (
                  <div className="mt-4 pt-4 border-t border-slate-100">
                    <span className="text-xs font-bold text-slate-700 block mb-2">Recommended Enhancements:</span>
                    <ul className="space-y-1 text-xs text-slate-600 list-disc list-inside">
                      {evalResult.topSuggestions.map((sug, i) => (
                        <li key={i}>{sug}</li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>

            </div>
          )}
        </div>
      );
    }

    // --- COMPARE PROMPTS VIEW ---
    function CompareView({
      compOrigPrompt, setCompOrigPrompt,
      compImprPrompt, setCompImprPrompt,
      compLoading, compResults, compError,
      handleRunComparison, copyToClipboard
    }) {
      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <h2 className="text-xl font-extrabold text-slate-900 flex items-center space-x-2">
              <i className="fa-solid fa-code-compare text-indigo-600"></i>
              <span>Side-by-Side Response Comparison</span>
            </h2>
            <p className="text-slate-500 text-xs mt-1">
              Observe how structured prompt improvements impact actual generative model outputs.
            </p>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">Original Prompt</label>
                <textarea
                  rows="4"
                  value={compOrigPrompt}
                  onChange={(e) => setCompOrigPrompt(e.target.value)}
                  placeholder="Enter original basic prompt..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 custom-scrollbar"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">Improved Prompt</label>
                <textarea
                  rows="4"
                  value={compImprPrompt}
                  onChange={(e) => setCompImprPrompt(e.target.value)}
                  placeholder="Enter optimized structured prompt..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 custom-scrollbar"
                />
              </div>
            </div>

            <div className="mt-4 flex justify-end">
              <button
                onClick={handleRunComparison}
                disabled={compLoading}
                className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-6 py-2.5 rounded-xl shadow transition flex items-center space-x-2 disabled:opacity-50"
              >
                {compLoading ? (
                  <>
                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                    <span>Running Dual Model Calls...</span>
                  </>
                ) : (
                  <>
                    <i className="fa-solid fa-play"></i>
                    <span>Run Side-by-Side Comparison</span>
                  </>
                )}
              </button>
            </div>
          </div>

          {compError && (
            <div className="p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs">
              {compError}
            </div>
          )}

          {compResults && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              {/* Original Model Response */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                    <span className="text-xs font-bold text-slate-500 uppercase">Original Prompt Output</span>
                    <button 
                      onClick={() => copyToClipboard(compResults.origResponse)}
                      className="text-[11px] text-slate-400 hover:text-slate-600"
                    >
                      <i className="fa-regular fa-copy"></i>
                    </button>
                  </div>
                  <div className="prose prose-slate prose-xs max-w-none text-slate-700 text-xs leading-relaxed whitespace-pre-wrap font-sans max-h-96 overflow-y-auto custom-scrollbar">
                    {compResults.origResponse}
                  </div>
                </div>
              </div>

              {/* Improved Model Response */}
              <div className="bg-white p-5 rounded-2xl border border-indigo-200 shadow-sm flex flex-col justify-between ring-1 ring-indigo-500/10">
                <div>
                  <div className="flex items-center justify-between pb-3 mb-3 border-b border-indigo-50">
                    <span className="text-xs font-bold text-indigo-600 uppercase flex items-center space-x-1">
                      <i className="fa-solid fa-sparkles"></i>
                      <span>Improved Prompt Output</span>
                    </span>
                    <button 
                      onClick={() => copyToClipboard(compResults.imprResponse)}
                      className="text-[11px] text-indigo-600 hover:text-indigo-800"
                    >
                      <i className="fa-regular fa-copy"></i>
                    </button>
                  </div>
                  <div className="prose prose-slate prose-xs max-w-none text-slate-800 text-xs leading-relaxed whitespace-pre-wrap font-sans max-h-96 overflow-y-auto custom-scrollbar">
                    {compResults.imprResponse}
                  </div>
                </div>
              </div>

            </div>
          )}
        </div>
      );
    }

    // --- TEMPLATES VIEW ---
    function TemplatesView({ sendToImprover, copyToClipboard }) {
      const [search, setSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      const categories = ['All', 'Study and Learning', 'Coding and Debugging', 'Academic Research', 'Resume and Interview Preparation', 'Presentation Creation', 'Content Writing', 'Business Planning', 'Data Analysis'];

      const filtered = INITIAL_TEMPLATES.filter(t => {
        const matchesCategory = selectedCategory === 'All' || t.category === selectedCategory;
        const matchesSearch = t.title.toLowerCase().includes(search.toLowerCase()) || t.description.toLowerCase().includes(search.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <h2 className="text-xl font-extrabold text-slate-900 flex items-center space-x-2">
              <i className="fa-solid fa-layer-group text-indigo-600"></i>
              <span>Prompt Templates Library</span>
            </h2>
            <p className="text-slate-500 text-xs mt-1">
              Curated, pre-engineered starter templates for common academic, coding, and professional workflows.
            </p>

            <div className="flex flex-col sm:flex-row gap-3 mt-4">
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search templates by keyword..."
                className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
              />
              <select
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
                className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none"
              >
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>

          {/* Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filtered.map(tmpl => (
              <div key={tmpl.id} className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between hover:border-indigo-200 transition">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                      {tmpl.category}
                    </span>
                    <button onClick={() => copyToClipboard(tmpl.prompt)} className="text-xs text-slate-400 hover:text-slate-600">
                      <i className="fa-regular fa-copy"></i>
                    </button>
                  </div>
                  <h3 className="font-bold text-slate-900 text-sm mb-1">{tmpl.title}</h3>
                  <p className="text-xs text-slate-500 mb-3">{tmpl.description}</p>
                  
                  <div className="bg-slate-900 text-slate-300 font-mono text-[11px] p-3 rounded-xl border border-slate-800 mb-4 max-h-32 overflow-y-auto custom-scrollbar">
                    {tmpl.prompt}
                  </div>
                </div>

                <button
                  onClick={() => sendToImprover(tmpl.prompt)}
                  className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs py-2 rounded-xl transition flex items-center justify-center space-x-1.5"
                >
                  <i className="fa-solid fa-wand-magic-sparkles text-indigo-600"></i>
                  <span>Use & Customize Template</span>
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- SAVED PROMPTS VIEW ---
    function SavedPromptsView({ savedPrompts, setSavedPrompts, sendToImprover, sendToEvaluator, copyToClipboard, showToast }) {
      const handleDelete = (id) => {
        setSavedPrompts(savedPrompts.filter(p => p.id !== id));
        showToast("Prompt deleted from saved list.");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <h2 className="text-xl font-extrabold text-slate-900 flex items-center space-x-2">
              <i className="fa-solid fa-bookmark text-indigo-600"></i>
              <span>Saved Laboratory Prompts</span>
            </h2>
            <p className="text-slate-500 text-xs mt-1">
              Prompts saved during your laboratory session. Stored locally in your browser cache.
            </p>
          </div>

          {savedPrompts.length === 0 ? (
            <div className="bg-white p-12 rounded-2xl border border-slate-200/80 text-center text-slate-400">
              <i className="fa-regular fa-bookmark text-3xl mb-2"></i>
              <p className="text-xs font-semibold">No saved prompts in laboratory storage yet.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 gap-4">
              {savedPrompts.map(item => (
                <div key={item.id} className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold text-slate-900">{item.title}</span>
                      <span className="text-[10px] text-slate-400">{item.date}</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Original</span>
                        <p className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-200">{item.original}</p>
                      </div>
                      <div>
                        <span className="text-[10px] font-bold text-indigo-600 uppercase block mb-1">Improved</span>
                        <p className="text-xs text-slate-800 bg-indigo-50/50 p-2.5 rounded-lg border border-indigo-100 font-mono">{item.improved}</p>
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button 
                      onClick={() => copyToClipboard(item.improved)}
                      className="text-xs px-2.5 py-1.5 text-slate-600 hover:bg-slate-100 rounded-lg"
                    >
                      <i className="fa-regular fa-copy mr-1"></i> Copy
                    </button>
                    <button 
                      onClick={() => sendToImprover(item.improved)}
                      className="text-xs px-2.5 py-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg"
                    >
                      <i className="fa-solid fa-wand-magic-sparkles mr-1"></i> Edit
                    </button>
                    <button 
                      onClick={() => handleDelete(item.id)}
                      className="text-xs px-2.5 py-1.5 text-red-600 hover:bg-red-50 rounded-lg"
                    >
                      <i className="fa-solid fa-trash mr-1"></i> Delete
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
